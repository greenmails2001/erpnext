x-erpnext-image: &erpnext-image
  image: frappe/erpnext:v16.60.0@sha256:3847babae025dae001e638b7fc5503c944fd968216b3074e60edfcc240fb2db6
  platform: linux/amd64
  pull_policy: always
  restart: unless-stopped

x-backend: &backend
  <<: *erpnext-image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    platform: linux/amd64
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MARIADB_AUTO_UPGRADE: 1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend

  redis-cache:
    image: redis:8.6-alpine@sha256:91c71f9ea78fa3fe268ff832a985c48e592244f707993773f8b3e1b244ac1137
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - backend

  redis-queue:
    image: redis:8.6-alpine@sha256:91c71f9ea78fa3fe268ff832a985c48e592244f707993773f8b3e1b244ac1137
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    networks:
      - backend

  configurator:
    <<: *erpnext-image
    restart: "no"
    entrypoint: ["bash", "-ec"]
    command:
      - |
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    networks:
      - backend

  create-site:
    <<: *backend
    profiles: ["setup"]
    restart: "no"
    entrypoint: ["bash", "-ec"]
    command:
      - |
        if [ -d "sites/${SITE_NAME}" ]; then
          echo "Site ${SITE_NAME} already exists"
          exit 0
        fi
        bench new-site "${SITE_NAME}" \
          --db-type mariadb \
          --db-host db \
          --db-port 3306 \
          --db-root-username root \
          --db-root-password "${DB_PASSWORD}" \
          --admin-password "${ADMIN_PASSWORD}" \
          --install-app erpnext \
          --mariadb-user-host-login-scope "%"
    environment:
      SITE_NAME: ${SITE_NAME:?SITE_NAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    networks:
      - backend

  backend:
    <<: *backend
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: 120
    networks:
      - backend

  frontend:
    <<: *erpnext-image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?SITE_NAME must be set}
      NGINX_LISTEN_PORT: 8080
      TRUST_UPSTREAM_FORWARDED_PROTO: "on"
      UPSTREAM_REAL_IP_ADDRESS: ${AUTH_GATEWAY_IP:?AUTH_GATEWAY_IP must be set}
      UPSTREAM_REAL_IP_RECURSIVE: "on"
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PUBLISH_PORT:-18080}:8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    networks:
      - frontend
      - backend

  origin-gateway:
    <<: *erpnext-image
    entrypoint: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/origin-gateway.conf"]
    network_mode: host
    volumes:
      - ./origin-gateway.conf:/etc/nginx/origin-gateway.conf:ro
    depends_on:
      - frontend

  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    networks:
      - backend

  queue-short:
    <<: *backend
    command: ["bench", "worker", "--queue", "short,default"]
    networks:
      - backend

  queue-long:
    <<: *backend
    command: ["bench", "worker", "--queue", "long,default,short"]
    networks:
      - backend

  scheduler:
    <<: *backend
    command: ["bench", "schedule"]
    networks:
      - backend

  backup:
    <<: *backend
    profiles: ["ops"]
    restart: "no"
    entrypoint: ["bash", "-ec"]
    command:
      - bench --site "${SITE_NAME}" backup --with-files
    environment:
      SITE_NAME: ${SITE_NAME:?SITE_NAME must be set}
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  sites:
  db-data:
  redis-queue-data:
